<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>digital clock</h1>
      <div class="clock-box">
        <div class="hours div">
          <span id="hours-num" class="num">00</span>
          <span>Hours</span>
        </div>
        <div class="minutes div">
          <span id="minutes-num" class="num">00</span>
          <span>Minutes</span>
        </div>
        <div class="seconds div">
          <span id="seconds-num" class="num">00</span>
          <span>Seconds</span>
        </div>
        <div>
          <p id="ampm">AM</p>
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
